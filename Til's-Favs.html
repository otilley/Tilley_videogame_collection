<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Til's Favs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav class="tabs">
            <a class="tab" href="about.html">About</a>
            <a class="tab" href="index.html">Games</a>
            <a class="tab active" href="Til's-Favs.html">Til's Favs</a>
            <span class="glider" style="transform: translateX(200%);"></span>
        </nav>
    </div>

    <main>
        <h1>Til's Favs</h1>
        <p class="intro">These are the games I keep coming back to and recommending to other people.</p>
    </main>

    <script>
        const tabs = document.querySelectorAll('.tab');
        const glider = document.querySelector('.glider');
        const currentFile = window.location.pathname.split('/').pop();
        const tabIndexByPage = {
            'about.html': 0,
            'index.html': 1,
            "Til's-Favs.html": 2
        };

        const activeIndex = tabIndexByPage[currentFile] ?? 2;

        tabs.forEach((tab, index) => {
            const isActive = index === activeIndex;
            tab.classList.toggle('active', isActive);
        });

        if (glider) {
            glider.style.transform = `translateX(${activeIndex * 100}%)`;
        }
    </script>
</body>
</html>
